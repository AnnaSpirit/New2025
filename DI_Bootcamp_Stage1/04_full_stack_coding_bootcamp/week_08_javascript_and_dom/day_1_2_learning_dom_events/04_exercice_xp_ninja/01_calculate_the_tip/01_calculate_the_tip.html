<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XP Ninja - Tip Calculator</title>
  </head>

  <body>
    <div id="container">
      <h1>Tip Calculator</h1>
      <div id="calculator">
        <form>
          <p>How much was your bill?</p>
          $ <input id="billamt" type="text" placeholder="Bill Amount" />

          <p>How was your service?</p>
          <select id="serviceQual">
            <option disabled selected value="0">-- Choose an Option --</option>
            <option value="0.3">30% - Outstanding</option>
            <option value="0.2">20% - Good</option>
            <option value="0.15">15% - It was OK</option>
            <option value="0.1">10% - Bad</option>
            <option value="0.05">5% - Terrible</option>
          </select>

          <p>How many people are sharing the bill?</p>
          <input id="peopleamt" type="text" placeholder="Number of People" />
          people

          <!-- Boutons de calcul et reset -->
          <button type="button" id="calculate" onclick="calculateTip()">
            Calculate!
          </button>
          <button type="button" id="reset">Reset</button>
        </form>
      </div>

      <!-- Résultat principal caché au départ -->
      <div id="totalTip" style="display: none; margin-top: 1em">
        <sup>$</sup><span id="tip"></span>
        <small id="each">each</small>
      </div>

      <!-- Détail du calcul caché au départ -->
      <div
        id="details"
        style="display: none; margin-top: 1em; font-size: 0.9em; color: #333"
      >
        <!-- Rempli par JS -->
      </div>
    </div>

    <!-- Ton script JS -->
    <script src="01_calculate_the_tip.js" defer></script>
  </body>
</html>
