<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="tell_the_story.js" defer></script>
    <title>Tell the story</title>
  </head>
  <body>
    <h1>Mad Libs</h1>

    <form id="libform">
      <label for="noun">Noun:</label><input type="text" id="noun" /><br />
      <label for="adjective">Adjective:</label
      ><input type="text" id="adjective" /><br />
      <label for="person">Someone's Name:</label
      ><input type="text" id="person" /><br />
      <label for="verb">Verb:</label><input type="text" id="verb" /><br />
      <label for="place">A place:</label><input type="text" id="place" /><br />
      <button id="lib-button">Lib it!</button>
    </form>

    <div id="story"></div>

    <!-- Bouton Shuffle (désactivé tant que le formulaire n’a pas été soumis) -->
    <button type="button" id="shuffle-button" disabled>Shuffle Story</button>
