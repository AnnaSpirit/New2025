<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="to_do_list_bonus.js" defer></script>
    <link rel="stylesheet" href="to_do_list.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="todo-container">
      <h1>TO-DO LIST</h1>

      <!-- Formulaire d’ajout -->
      <form id="todoForm">
        <input
          type="text"
          id="taskInput"
          placeholder="new task"
          autocomplete="off"
          required
        />
        <button type="submit">ADD</button>
      </form>

      <div id="taskCount"></div>

      <!-- Ici les tâches créées par JS -->
      <div class="listTasks"></div>

      <!-- Bouton Clear (sera activé par JS plus tard) -->
      <a href="#" class="clear">Clear</a>
    </div>
  </body>
</html>
