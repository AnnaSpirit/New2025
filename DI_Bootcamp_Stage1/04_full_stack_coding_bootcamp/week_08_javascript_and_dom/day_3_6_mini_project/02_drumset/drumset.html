<!DOCTYPE html>
<html>
  <head>
    <title>Drum Set</title>
    <script defer type="text/javascript" src="drumset_script.js"></script>
    <link rel="stylesheet" type="text/css" href="drumset_style.css" />
  </head>
  <body>
	<header>
	  <h1 id="title">Drum child Set</h1>
	  <p id="instruction">Click or letter on keyboard to play sounds!</p>
    <div class="overlay"></div>
    <div class="container">
      <!-- Chaque div représente une touche -->
      <div class="drum charleston" data-key="65">
        <kbd>A</kbd><span class="note">Charleston</span>
      </div>
      <div class="drum boing" data-key="83">
        <kbd>S</kbd><span class="note">Clap</span>
      </div>
      <div class="drum mbira" data-key="68">
        <kbd>D</kbd><span class="note">Mbira</span>
      </div>
      <div class="drum kick" data-key="70">
        <kbd>F</kbd><span class="note">Kick</span>
      </div>
      <div class="drum openhat" data-key="71">
        <kbd>G</kbd><span class="note">OpenHat</span>
      </div>
      <div class="drum ride" data-key="72">
        <kbd>H</kbd><span class="note">Ride</span>
      </div>
      <div class="drum triangle" data-key="74">
        <kbd>J</kbd><span class="note">Triangle</span>
      </div>
      <div class="drum tom" data-key="75">
        <kbd>L</kbd><span class="note">Tom</span>
      </div>
      <div class="drum gag" data-key="76">
        <kbd>K</kbd><span class="note">Gag</span>
      </div>

      <!-- Les sons correspondants aux touches -->
      <audio data-key="65" src="./sounds/charleston.aac"></audio>
      <audio data-key="83" src="./sounds/boing.aac"></audio>
      <audio data-key="68" src="./sounds/mbira.aac"></audio>
      <audio data-key="70" src="./sounds/kick.wav"></audio>
      <audio data-key="71" src="./sounds/openhat.wav"></audio>
      <audio data-key="72" src="./sounds/ride.wav"></audio>
      <audio data-key="74" src="./sounds/triangle.aac"></audio>
      <audio data-key="76" src="./sounds/gag.aac"></audio>
      <audio data-key="75" src="./sounds/tom.aac"></audio>
    </div>
  </body>
</html>
