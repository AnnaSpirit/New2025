<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Star Wars Characters</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
  </head>
  <body>
    <h1 class="logo">STAR<br />WARS</h1>

    <div id="card" class="card">
      <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p>Loading...</p>
      </div>
      <div id="info" class="info hidden">
        <h2 id="name"></h2>
        <p><strong>Height:</strong> <span id="height"></span></p>
        <p><strong>Gender:</strong> <span id="gender"></span></p>
        <p><strong>Birth Year:</strong> <span id="birth_year"></span></p>
        <p><strong>Home World:</strong> <span id="homeworld"></span></p>
      </div>
      <div id="error" class="error hidden">
        <p>Oh No! That person isn't available.</p>
      </div>
    </div>

    <button id="btn">Find Someone</button>
  </body>
</html>
