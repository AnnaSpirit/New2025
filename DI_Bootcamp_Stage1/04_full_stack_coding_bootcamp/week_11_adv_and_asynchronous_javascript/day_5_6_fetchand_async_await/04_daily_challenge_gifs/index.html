<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Giphy Search</title>
  </head>
  <body>
    <h1>GIF Generator 😎</h1>

    <form id="gifForm">
      <input
        type="text"
        id="searchInput"
        placeholder="Enter a category (e.g. cat, sun...)"
      />
      <button type="submit">Get GIF</button>
    </form>

    <button id="deleteAllBtn">DELETE ALL</button>

    <div id="gifContainer"></div>

    <div>
      <p>
        This app allows the user to search a random GIF by category using the
        Giphy API. Each GIF appears with a funny DELETE button. The "DELETE ALL"
        button removes every GIF. The fetch uses the `random` endpoint with a
        tag based on the user’s input.
      </p>
    </div>
  </body>
</html>
