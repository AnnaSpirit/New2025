<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Data</title>
  </head>
  <body>
    <h1>Welcome!</h1>
    <section id="result">
      <!-- On injectera ici First Name et Last Name via JavaScript -->
    </section>

    <script>
      // Récupère les paramètres de l'URL
      const params = new URLSearchParams(window.location.search);

      // Extrait firstName et lastName
      const firstName = params.get("firstName");
      const lastName = params.get("lastName");

      // Sélectionne la section où afficher
      const resultSection = document.getElementById("result");

      // Si on a bien les deux valeurs, on les affiche
      if (firstName && lastName) {
        // Création d'un paragraphe
        const p = document.createElement("p");
        p.textContent = `Your first name is: ${firstName} — Your last name is: ${lastName}`;
        resultSection.appendChild(p);
      } else {
        // Au cas où on arrive ici sans données
        resultSection.textContent = "No data received...";
      }
    </script>
  </body>
</html>
