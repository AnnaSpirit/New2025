<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap"
      rel="stylesheet"
    />
    <title>Robot Friend</title>
  </head>
  <body>
    <h1>Robot Friend</h1>
    <p>Fly with the mouse your friend-robot to make it move!</p>
    <div class="robot">
      <!-- HEAD » -->
      <div class="head">
        <div class="antenna antenna-left"></div>
        <div class="antenna antenna-right"></div>
        <div class="eye eye-left"></div>
        <div class="eye eye-right"></div>
      </div>

      <!-- BODY » -->
      <div class="body">
        <!-- TORSE (TORSO) -->
        <div class="torso"></div>

        <!-- MEMBRES (BRAS & JAMBES) -->
        <div class="limbs">
          <div class="limb arm-left"></div>
          <div class="limb arm-right"></div>
          <div class="limb leg-left"></div>
          <div class="limb leg-right"></div>
        </div>
      </div>
    </div>
  </body>
</html>
